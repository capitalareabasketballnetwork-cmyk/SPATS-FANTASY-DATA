name: Update NFL player data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 2'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.build --start 1999 --end $(date +%Y)
      - run: pytest -q
      - name: Commit updated datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update player statistics and fantasy scoring' && git push)
